<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
  <h1>Mini App 🔥</h1>

  <button onclick="send()">Send</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    function send() {
      tg.sendData(JSON.stringify({
        action: "test"
      }));
    }
  </script>
</body>
</html>
