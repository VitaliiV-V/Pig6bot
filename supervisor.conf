[supervisord]
nodaemon=true

[program:api]
directory=/app
command=uvicorn main:app --host 0.0.0.0 --port 2322
autostart=true
autorestart=true
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api_err.log

[program:bot1]
command=python main.py
autostart=true
autorestart=true

